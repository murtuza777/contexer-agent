name: Contexer acceptance gate
description: >-
  Replay a project's approved acceptance contracts in a real browser and block the
  merge when behaviour regresses. Posts a contexer/acceptance commit status and
  uploads an evidence report (screenshots, traces, expected vs actual).
author: murtuza777
branding:
  icon: check-circle
  color: green

inputs:
  working-directory:
    description: Project directory containing .contexer/contracts.
    default: "."
  url:
    description: Verify an app that is already running at this URL instead of starting it.
    default: ""
  post-status:
    description: "Post a contexer/acceptance commit status (needs the statuses: write permission)."
    default: "true"
  github-token:
    description: Token used to post the commit status.
    default: ${{ github.token }}
  python-version:
    description: Python used to run Contexer.
    default: "3.12"

outputs:
  outcome:
    description: pass, fail, needs_action or error.
    value: ${{ steps.gate.outputs.outcome }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Contexer
      shell: bash
      run: |
        start=$SECONDS
        python -m pip install --quiet "${{ github.action_path }}/contexer-agent"
        echo "PLAYWRIGHT_VERSION=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_ENV"
        echo "Contexer installed in $((SECONDS - start))s"

    - name: Cache Chromium
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: contexer-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

    - name: Install Chromium
      shell: bash
      run: |
        start=$SECONDS
        python -m playwright install chromium
        # GitHub's Ubuntu images ship Google Chrome, so Chromium's system libraries are
        # usually present; the slow apt step runs only when the browser cannot start.
        if ! python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
          python -m playwright install-deps chromium
        fi
        echo "Chromium ready in $((SECONDS - start))s"

    - name: Replay approved contracts
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(replay --dir . --json)
        if [ -n "${{ inputs.url }}" ]; then args+=(--url "${{ inputs.url }}"); fi
        if [ "${{ inputs.post-status }}" = "true" ]; then args+=(--github); fi
        set +e
        contexer "${args[@]}" > "$RUNNER_TEMP/contexer-result.json"
        code=$?
        set -e
        outcome=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['decision']['outcome'])" "$RUNNER_TEMP/contexer-result.json" 2>/dev/null || echo error)
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Upload evidence report
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: contexer-report
        path: ${{ inputs.working-directory }}/.contexer/runs/
        if-no-files-found: ignore
