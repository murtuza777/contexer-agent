[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexer-agent"
version = "0.4.0"
description = "Proof that your coding agent is done: approved checks, proven in a real browser, before the change reaches review"
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [
    { name = "Contexer Contributors" },
]
keywords = ["cli", "ai-agents", "coding-agents", "acceptance-testing", "playwright", "ci", "claude-code", "codex", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.49.0",  # Locator.aria_snapshot
]


[project.urls]
Homepage = "https://github.com/murtuza777/contexer-agent"
Documentation = "https://github.com/murtuza777/contexer-agent/blob/main/contexer-agent/docs/try-it.md"
Changelog = "https://github.com/murtuza777/contexer-agent/blob/main/contexer-agent/CHANGELOG.md"
Issues = "https://github.com/murtuza777/contexer-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
contexer = "contexer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/contexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

