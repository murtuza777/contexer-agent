[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexer-agent"
version = "0.4.0"
description = "Proof that your coding agent is done: approved checks, proven in a real browser, before the change reaches review"
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [
    { name = "Contexer Contributors" },
]
keywords = ["cli", "ai-agents", "coding-agents", "acceptance-testing", "playwright", "ci", "claude-code", "codex", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "openai>=2.45.0",  # the floor langchain-openai needs
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.49.0",  # Locator.aria_snapshot
    # Chat models with tool calling for the agents (llm/chat.py, crew/). Floors are
    # the versions the tool-call round trip was verified against on 2026-11-15.
    "langchain-core>=1.8.1,<2.0",
    "langchain-openai>=1.8.0,<2.0",
    "langchain-anthropic>=1.7.10,<2.0",
]


[project.urls]
Homepage = "https://github.com/murtuza777/contexer-agent"
Documentation = "https://github.com/murtuza777/contexer-agent/blob/main/contexer-agent/docs/try-it.md"
Changelog = "https://github.com/murtuza777/contexer-agent/blob/main/contexer-agent/CHANGELOG.md"
Issues = "https://github.com/murtuza777/contexer-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.17,<1.0",
    "pyright>=1.1.400",
]

# Langfuse tracing for the agents; used only when LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY are set.
tracing = [
    "langfuse>=5.2.0,<6.0",
]

[project.scripts]
contexer = "contexer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/contexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["bench/fixtures"]

[tool.ruff.lint]
# Errors, unused and undefined names, import order, likely bugs, and syntax the supported Pythons have
# moved on from. Formatting is not enforced.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length: long strings and prompts read better unwrapped
    "B008",   # typer declares options as default arguments
    "B905",   # zip() without strict=: the pairs here are built to the same length
    "UP042",  # (str, Enum) classes predate StrEnum and are part of stored data
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

