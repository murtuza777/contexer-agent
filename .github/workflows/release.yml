# Builds the contexer-agent package on every push to main, and publishes it to PyPI when a
# version tag (v0.4.0) is pushed.
#
# Publishing uses PyPI trusted publishing: no token is stored anywhere. Once, on pypi.org
# (Account settings > Publishing > Add a new pending publisher), register:
#   PyPI project name: contexer-agent   Owner: murtuza777   Repository: contexer-agent
#   Workflow name: release.yml          Environment: pypi
# Then: git tag v0.4.0 && git push origin v0.4.0
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "contexer-agent/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contexer-agent
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/contexer --version
          /tmp/fresh/bin/contexer --help > /dev/null
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: contexer-agent/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contexer-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
