name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and seeded-bug benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contexer-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider --deselect tests/test_opencode_integration.py::test_live_opencode_e2e
      - name: Benchmark (catch rate and false failures)
        run: contexer bench --repeats 2 --out bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: contexer-agent/bench-results.json
          if-no-files-found: ignore
