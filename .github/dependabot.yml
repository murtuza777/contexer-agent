version: 2
updates:
  - package-ecosystem: pip
    directory: /contexer-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The website and the two JavaScript benchmark fixtures. Without these entries a security
  # advisory for Next.js or Vite reached nobody: the website sat on a vulnerable Next.js.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /contexer-agent/bench/fixtures/guestbook-next/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /contexer-agent/bench/fixtures/budget-react/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
